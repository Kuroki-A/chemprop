# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64
    - name: Install dependencies
      shell: bash {0}
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -e ".[test,features]"
    - name: Lint with flake8
      shell: bash {0}
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      shell: bash {0}
      run: |
        pytest -v
    - name: Build and inspect wheel
      if: matrix.python-version == '3.10'
      shell: bash {0}
      run: |
        python -m pip install build
        python -m build --wheel --outdir dist/ .
        python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0]; names = set(zipfile.ZipFile(wheel).namelist()); required = {'chemprop/web/app/schema.sql', 'chemprop/web/app/templates/layout.html', 'chemprop/web/app/static/stylesheets/style.css', 'chemprop/web/app/static/jsme/jsme/jsme.nocache.js'}; forbidden = {'chemprop/features/_features_generators.py'}; missing = sorted(required - names); unexpected = sorted(forbidden & names); assert not missing, f'Missing wheel assets: {missing}'; assert not unexpected, f'Unexpected local-only modules: {unexpected}'"
